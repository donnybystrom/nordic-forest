<!doctype html><html lang="sv"><meta charset="utf-8"><title>Nordic Forest · Agent Control</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#0d1715;color:#e5ede7;font:15px system-ui;line-height:1.5}header{padding:26px 36px;border-bottom:1px solid #294039}h1{margin:0;font-size:26px}p{color:#abc1b5}main{display:grid;grid-template-columns:330px 1fr;gap:24px;padding:28px 36px}aside,section{min-width:0}button{background:#25483c;color:#fff;border:1px solid #4f7966;padding:10px 14px;border-radius:8px;cursor:pointer}button:hover{background:#346550}.job{display:block;text-align:left;width:100%;margin:0 0 10px}.badge{font-size:12px;color:#e6cd8c}.panel{border:1px solid #294039;background:#14231e;padding:18px;border-radius:12px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c5d7cd;font:13px ui-monospace}label{display:block;margin:8px 0}input,textarea,select{box-sizing:border-box;width:100%;background:#0d1715;color:#e5ede7;border:1px solid #446453;padding:9px;border-radius:6px}a{color:#b5d4bc}.danger{background:#653c37}.actions{display:flex;gap:12px;flex-wrap:wrap}small{color:#adc1b4}#error{color:#f1aba0}@media(max-width:850px){main{grid-template-columns:1fr}}
</style><header><h1>Nordic Forest · Agent Control</h1><p>Features, överlämningar och granskningsunderlag · Lokal pilot · GitHub Projects · <a href="https://github.com/users/donnybystrom/projects/2">Öppna Nordic Forest-boarden</a></p></header>
<main><aside><h2>Körningar</h2><div id="jobs"></div><details class="panel"><summary>Starta ett jobb</summary>
<label>Flow<select id="operation"><option value="plan_feature">Plan Feature</option><option value="collect_audit_reference">Collect and Audit Reference</option><option value="propose_agent_change">Propose Agent Change</option></select></label>
<label>Uppgift<textarea id="request" rows="5">Planera en avgränsad jämförelse av ett ekträds LOD-nivåer.</textarea></label>
<label>Körläge<select id="live"><option value="false">Offline-förhandsgranskning</option><option value="true">Kör på riktigt · API-anrop/verktyg</option></select></label><button id="submit">Starta nytt jobb</button></details></aside>
<section><h2 id="title">Välj en körning</h2><p id="error" role="alert"></p><div id="detail"></div></section></main>
<script>
let selected=null, selectedJob=null, renderEpoch=0, renderedKey='';const $=x=>document.getElementById(x);
const localTime=x=>new Date(x).toLocaleTimeString('sv-SE',{timeZone:'Europe/Stockholm'});
async function api(path,method='GET',body,key){const headers={};if(body)headers['Content-Type']='application/json';if(key)headers['Idempotency-Key']=key;
 const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||d.error);return d;}
function block(title,value){const panel=document.createElement('div');panel.className='panel';const h=document.createElement('h3');h.textContent=title;panel.append(h);const pre=document.createElement('pre');pre.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);panel.append(pre);return panel;}
async function list(){const d=await api('/jobs');$('jobs').replaceChildren();for(const j of d.jobs){const b=document.createElement('button');b.className='job';b.textContent=j.request.operation+(j.request.operation==='run_agent'?' · '+j.request.target_role:'')+' · '+j.status+'\n'+localTime(j.created);b.onclick=()=>show(j.id);$('jobs').append(b);}}
async function show(id){selected=id;const epoch=++renderEpoch;const [j,events]=await Promise.all([api('/jobs/'+id),api('/jobs/'+id+'/events')]);if(epoch!==renderEpoch)return;const key=id+'|'+j.updated+'|'+(events.events.at(-1)?.seq||0);if(key===renderedKey)return;renderedKey=key;selectedJob=j;$('title').textContent=j.request.operation+(j.request.operation==='run_agent'?' · '+j.request.target_role:'')+' · '+j.status;const area=$('detail');area.replaceChildren();area.append(block('Uppdrag',j.request.request));
 const result=j.result;if(result.packet){area.append(block('Planerade ansvar och överlämningar',result.packet.stages.map(s=>s.stage+' → '+s.role).join('\n')));for(const s of result.packet.results)area.append(block(s.role+' · '+s.stage,s.handover));}
 if(result.proposal){area.append(block('Agentändring · ej publicerad',result.proposal.diff));for(const [role,review]of Object.entries(result.reviews)){const card=block(role+' · '+review.status,review.recommendation);const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Visa fullständigt granskningsunderlag';details.append(summary);const pre=document.createElement('pre');pre.textContent=JSON.stringify(review,null,2);details.append(pre);card.append(details);area.append(card);}area.append(block('Utvärdering och publicering',{evaluation:result.evaluation,publication:result.publication,decision:j.decision}));}
 if(result.agent){area.append(block('Sparad agent',result.agent));if(j.request.shared_context)area.append(block('Kontext från tidigare steg',j.request.shared_context));area.append(block('Överlämning',result.handover||{status:j.status,handover:null}));}
 if(result.review)area.append(block('Lokal kodgranskning · '+result.review.verdict,result.review));
 if(result.scope==='github_delivery'){const pr=result.output;if(pr?.url){const a=document.createElement('a');a.href=pr.url;a.textContent='Öppna PR / granskningsunderlag i GitHub';area.append(a);}area.append(block('PR-operation',{action:result.action,status:j.status,result:pr?.files?{url:pr.url,head_sha:pr.head_sha,classification:pr.classification,review_threads:pr.threads.length}:pr,preview:result.planned_command}));}
 if(!result.packet&&!result.proposal&&!result.agent&&!result.review&&result.scope!=='github_delivery')area.append(block('Resultat',result));
 const actions=document.createElement('div');actions.className='actions';
 if(['queued','running','interrupted','remote_cancel_unconfirmed'].includes(j.status)){const b=document.createElement('button');b.textContent='Begär avbrott';b.onclick=()=>act('/cancel',{});actions.append(b);}
 if(j.status==='interrupted'){const b=document.createElement('button');b.textContent='Återanslut och avstäm';b.onclick=()=>act('/resume',{});actions.append(b);}
 if(j.status==='awaiting_review'){const character=j.request.operation==='character_pipeline';for(const [value,label]of[[character?'approve_generation':'approve_direction',character?'Godkänn en Rodin-generering':'Godkänn förslagets riktning'],['reject','Avslå förslaget']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>act('/decision',{decision:value,result_sha256:j.result_sha256});actions.append(b);}const note=document.createElement('p');note.textContent=character?'Godkännandet gäller dessa bildhashar och Rodin-inställningar. Ett separat submit_rodin-steg startar en betald generering. Mesh, rigg, animation och fysik granskas därefter.':'Beslutet gäller detta förslag och dess hash. Det publicerar ingen agentversion och ersätter inte tester eller en GitHub PR-granskning.';area.append(note);}
 area.append(actions);area.append(block('Aktiviteter och överlämningskommentarer',events.events.map(e=>localTime(e.at)+' · '+e.actor+' · '+e.kind+'\n'+JSON.stringify(e.detail)).join('\n\n')));}
async function act(suffix,body){try{await api('/jobs/'+selected+suffix,'POST',body);await show(selected);await list();}catch(e){$('error').textContent=e.message;}}
$('submit').onclick=async()=>{const key=crypto.randomUUID();try{const d=await api('/jobs','POST',{operation:$('operation').value,request:$('request').value,live:$('live').value==='true'},key);await list();await show(d.job.id);}catch(e){$('error').textContent=e.message;}};
(async()=>{try{const r=await fetch('/ui-session',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Bootstrap':'__BOOTSTRAP__'},body:'{}'});if(!r.ok)throw Error('Ladda om sidan för en ny lokal session');await list();setInterval(async()=>{try{await list();if(selected)await show(selected);}catch(e){$('error').textContent=e.message;}},4000);}catch(e){$('error').textContent=e.message;}})();
</script></html>
